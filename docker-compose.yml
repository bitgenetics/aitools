# Local development registry.
#
# Usage:
#   cp .env.example .env          # then edit secrets
#   docker compose up -d          # start in background
#   docker compose down           # stop (data persists in volume)
#   docker compose down -v        # stop and wipe data
#
# The registry listens on http://localhost:4873.
# Add it to your project config:
#   aitools config registry add local http://localhost:4873

services:
  registry:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4873:4873"
    env_file:
      - packages/server/.env
    environment:
      PORT: "4873"
      HOST: "0.0.0.0"
      AI_TOOLS_DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - registry-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4873/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - packages/server/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ai_tools -d ai_tools
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  registry-data:
  postgres-data:
