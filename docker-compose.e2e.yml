# E2E test environment.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
#   docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
#
# Services:
#   test-registry — HTTP Fastify registry (@bitgenetics/aitools-server)
#   gitea         — Git hosting for git-registry e2e tests (bootstraps on first start)
#   e2e           — Jest test runner (starts after dependencies are healthy)
#
# Git registry tests use Gitea when GITEA_URL is set (Docker). Locally they
# fall back to a temporary bare repository.

volumes:
  gitea-data:

services:
  test-registry:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "4873"
      HOST: "0.0.0.0"
      AITOOLS_DATA_DIR: /data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4873/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  gitea:
    image: gitea/gitea:1.22.6
    volumes:
      - gitea-data:/data
      - ./packages/e2e/gitea/bootstrap.sh:/bootstrap.sh:ro
      - ./packages/e2e/gitea/entrypoint.sh:/entrypoint.sh:ro
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: gitea
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA_ADMIN_USER: e2e
      GITEA_ADMIN_PASSWORD: e2e-test-pass
      GITEA_ADMIN_EMAIL: e2e@test.com
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /entrypoint.sh | /bin/bash -s --"]
    command: ["/usr/local/bin/gitea", "web"]
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:3000/api/healthz
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      REGISTRY_URL: "http://test-registry:4873"
      GITEA_URL: "http://gitea:3000"
      GITEA_ADMIN_USER: "e2e"
      GITEA_ADMIN_PASSWORD: "e2e-test-pass"
      GITEA_REPO_NAME: "tools-registry"
      GIT_REGISTRY_STATE_FILE: "/tmp/aitools-e2e-git-registry.json"
      GIT_TERMINAL_PROMPT: "0"
      PATH: "/app/packages/cli/node_modules/.bin:/app/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      AITOOLS_CLI: "node /app/packages/cli/dist/cli.js"
    depends_on:
      test-registry:
        condition: service_healthy
      gitea:
        condition: service_healthy
