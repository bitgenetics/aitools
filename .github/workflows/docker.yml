name: Docker Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - packages/core/**
      - packages/server/**
      - package.json
      - package-lock.json

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root user
        run: |
          uid=$(docker run --rm ai-tools:${{ github.sha }} id -u)
          echo "Container runs as uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "Expected non-root USER in Dockerfile, got root"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
