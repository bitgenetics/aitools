name: Docker Build

# PR verification only: the image builds and runs as non-root. Pushing the image to
# GHCR happens in ci.yml's `ship` job when a release commit lands on main.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - packages/core/**
      - packages/server/**
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-tools:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root user
        run: |
          uid=$(docker run --rm ai-tools:${{ github.sha }} id -u)
          echo "Container runs as uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "Expected non-root USER in Dockerfile, got root"
            exit 1
          fi
