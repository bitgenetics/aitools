name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match workspace version $VERSION"
            exit 1
          fi
          for pkg in core cli; do
            PKG_VERSION="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "packages/$pkg/package.json version $PKG_VERSION does not match tag v$TAG"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Pin workspace dependency versions for publish
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          npm pkg set "dependencies.@bitgenetics/aitools-core=$VERSION" -w @bitgenetics/aitools-cli

      - name: Publish @bitgenetics/aitools-core
        run: npm publish -w @bitgenetics/aitools-core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @bitgenetics/aitools-cli
        run: npm publish -w @bitgenetics/aitools-cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
