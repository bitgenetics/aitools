name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  verify-checks:
    name: Verify Test and E2E passed
    runs-on: ubuntu-latest
    steps:
      - name: Wait for required workflows on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = ['Test', 'E2E Tests'];
            const sha = context.sha;
            const maxAttempts = 60;
            const intervalMs = 30_000;

            function latestRun(runs, name) {
              const matches = runs.filter((run) => run.name === name);
              if (matches.length === 0) {
                return undefined;
              }
              return matches.sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at),
              )[0];
            }

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });

              let pending = false;
              let failed = false;
              const messages = [];

              for (const name of required) {
                const run = latestRun(data.workflow_runs, name);
                if (!run) {
                  pending = true;
                  messages.push(`${name}: not found (push to main and wait for CI before tagging)`);
                  continue;
                }
                if (run.status !== 'completed') {
                  pending = true;
                  messages.push(`${name}: ${run.status}`);
                  continue;
                }
                if (run.conclusion !== 'success') {
                  failed = true;
                  messages.push(`${name}: ${run.conclusion}`);
                }
              }

              if (failed) {
                core.setFailed(
                  `Required workflows did not pass for ${sha}:\n${messages.join('\n')}`,
                );
                return;
              }

              if (!pending) {
                core.info(`All required workflows passed for ${sha}.`);
                return;
              }

              core.info(
                `Attempt ${attempt}/${maxAttempts} — waiting for CI:\n${messages.join('\n')}`,
              );
              await new Promise((resolve) => setTimeout(resolve, intervalMs));
            }

            core.setFailed(
              `Timed out after 30 minutes waiting for Test and E2E Tests on ${sha}.`,
            );

  publish:
    runs-on: ubuntu-latest
    needs: verify-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match workspace version $VERSION"
            exit 1
          fi
          for pkg in core cursor cli; do
            PKG_VERSION="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "packages/$pkg/package.json version $PKG_VERSION does not match tag v$TAG"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pin workspace dependency versions for publish
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          npm pkg set "dependencies.@bitgenetics/aitools-core=$VERSION" -w @bitgenetics/aitools-cli
          npm pkg set "dependencies.@bitgenetics/aitools-cursor=$VERSION" -w @bitgenetics/aitools-cli

      - name: Publish @bitgenetics/aitools-core
        run: npm publish -w @bitgenetics/aitools-core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @bitgenetics/aitools-cursor
        run: npm publish -w @bitgenetics/aitools-cursor --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Guard against npm read-after-write propagation lag: the CLI pins exact
      # deps on aitools-core@<version> and aitools-cursor@<version>, so it must
      # not be published until those versions are resolvable on the registry
      # read path. Otherwise users hit `ETARGET: No matching version found`.
      - name: Wait for CLI dependencies to be resolvable on npm
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          for pkg in aitools-core aitools-cursor; do
            for attempt in $(seq 1 30); do
              RESOLVED="$(npm view "@bitgenetics/$pkg@$VERSION" version --prefer-online 2>/dev/null || true)"
              if [ "$RESOLVED" = "$VERSION" ]; then
                echo "@bitgenetics/$pkg@$VERSION is resolvable on npm (attempt $attempt)."
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Timed out after 5 minutes waiting for @bitgenetics/$pkg@$VERSION to become resolvable."
                exit 1
              fi
              echo "Attempt $attempt/30: @bitgenetics/$pkg@$VERSION not yet visible; sleeping 10s..."
              sleep 10
            done
          done
          # Small extra buffer for CDN edge propagation before the dependent publish.
          sleep 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @bitgenetics/aitools-cli
        run: npm publish -w @bitgenetics/aitools-cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
